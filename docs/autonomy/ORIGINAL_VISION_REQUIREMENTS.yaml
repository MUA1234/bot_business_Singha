  - id: FOUND-006
    title: Service-role and RLS read/write cutover
    description: Application reads and writes run as the authenticated user under RLS rather than through the RLS-bypassing service-role client.
    business_outcome: Company isolation is enforced by the database for real traffic, not only by query discipline.
    phase: stage1
    priority: P0
    dependencies: []
    status: locally_verified
    feature_flag: RLS_READS, RLS_WRITES
    runtime_entrypoint: src/lib/supabase/read.ts (shim returns the authenticated RLS client when flags are ON, service-role when OFF)
    database_evidence: RLS policies exist across migrations 0008+; migration 0084 caller/trust boundary; service-only RPCs locked to service_role in 0062/0063
    service_evidence: src/lib/supabase/read.ts; migrated user-facing pages/actions and mixed-context helpers use supabaseReadClient/supabaseWriteClient with service-role defaults only for service-only RPCs, storage and cron/webhook/health/inngest paths
    ui_evidence: none
    test_evidence: tests/integration/rls-coverage.test.ts; write-isolation.test.ts; company-isolation.test.ts; found006-read-cutover-isolation.test.ts; full integration suite 697 passed / 77 files with RLS_READS=on RLS_WRITES=on on disposable PostgreSQL 16
    security_evidence: service-only SECURITY DEFINER RPCs reachable only by service_role; mixed-context helpers accept caller-supplied client so user paths route through authenticated RLS while service paths keep service-role; supabase-admin-system.json allowlist shrank from 20 to 19 files
    audit_health_evidence: scripts/completion-inventory.mjs counts admin-client files and enforces the allowlist
    last_verified_sha: 0e6743a
    last_verified_at: 2026-08-22
    owner_gate: flag activation (RLS_READS/RLS_WRITES remain default-OFF pending staging UAT; the cutover is verified only when flags are explicitly enabled)
    blocker: none
    residual_risks: OF-017 remains an unresolved topological boundary: under the PostgREST shared-login model `session_user` is `authenticator`, a member of both `authenticated` and `service_role`, so a caller with arbitrary SQL as `authenticated` can `set role service_role` and reach every service-only entrypoint. Remediation requires a separate connection identity for the service backend — an owner infrastructure decision, pinned by tests. OF-014 residual also remains: a caller with arbitrary SQL as `authenticated` can forge `request.jwt.claims` to impersonate any user to RLS policies. These are outside the supported client boundary; see docs/architecture-v2/FOUND_006_TRUST_MODEL.md §5.

