  - id: AIM-002
    title: Task-level deduplication
    description: A stable company-scoped task identity prevents the same follow-up being recreated on every re-analysis, while genuinely distinct recurring work is preserved.
    business_outcome: Staff do not receive the same task repeatedly.
    phase: stage1
    priority: P0
    dependencies: [AIM-001]
    status: locally_verified
    feature_flag: none
    runtime_entrypoint: src/management/ai-manager/analyze-conversation.ts and src/app/app/command/analyze/actions.ts — both production analysis paths now create tasks through create_task_deduplicated (migration 0073); tasks_set_identity_hash trigger fires on every task write
    database_evidence: src/db/migrations/0071_task_identity_dedup.sql (identity columns, task_identity_hash, partial unique index, task_duplicate_suggestions); src/db/migrations/0073_case_tasks_through_dedup.sql (create_management_case_atomic creates every task through the dedup boundary and records deduplicated_tasks)
    service_evidence: create_task_deduplicated create-or-return; src/management/ai-manager/task-identity.ts decides which business facts are offered; similarity suggestions are advisory only and never merge
    ui_evidence: src/app/app/command/analyze/AnalyzeForm.tsx reports deduplicated work rather than showing an unexplained zero
    test_evidence: tests/integration/task-dedup.test.ts (18 deterministic integration scenarios on live PostgreSQL); tests/integration/case-task-dedup-wiring.test.ts (13 scenarios covering the production wiring, non-merging of distinct work, and unchanged atomicity); tests/campaign/task-identity.test.ts (9 unit scenarios)
    security_evidence: identity is SERVER-computed by a SECURITY DEFINER trigger and recomputed on insert AND update so a caller or model cannot forge it; RPC is service-only with an in-function role gate; identity components are length-bounded; company_id is inside both the hash and the unique index; the suggestions table is service-write-only under RLS
    audit_health_evidence: the RPC returns a created flag distinguishing a new task from a replay
    last_verified_sha: ca0432a
    last_verified_at: 2026-08-18
    owner_gate: hosted migration application
    blocker: none
    residual_risks: Exact identity only matches an identical normalised purpose, so a model that paraphrases its own title still produces a second task — that is concern (2) of migration 0071 (semantic similarity), which is advisory by design and has no producer yet, so task_duplicate_suggestions is never populated. The occurrence window is a UTC date, so an analysis at 23:59 and one at 00:01 are different windows. The manual command-centre path scopes identity to the submitted content on purpose: a free-text update names no stable entity, and merging on title alone would fuse distinct work.

  - id: AIM-003
    title: Truthful task routing
    description: Every AI-created task terminates in a truthful routing state (assigned, queued, needs routing, awaiting approval, rejected) with persisted routing reason and audit history.
    business_outcome: Work that the system captured actually reaches a person.
    phase: stage1
    priority: P0
    dependencies: [AIM-002]
    status: locally_verified
    feature_flag: none
    runtime_entrypoint: src/management/routing/route-captured-tasks.ts, called by src/app/app/command/analyze/actions.ts after every analysis
    database_evidence: src/db/migrations/0072_task_routing_state.sql (task_routing with seven states, reason_code, one-active-row partial unique index; append-only task_routing_events; route_task transition RPC; task_assignee_ineligible_reason)
    service_evidence: captureRoutingState maps the deterministic authority outcome to needs_routing or manual_review; a routing failure is counted and reported, never silently dropped
    ui_evidence: src/app/app/command/analyze/AnalyzeForm.tsx renders the durable per-state counts and says plainly that nothing was executed and no one was notified
    test_evidence: tests/integration/task-routing.test.ts; tests/campaign/capture-routing.test.ts; tests/campaign/analyze-ui-truthfulness.test.ts
    security_evidence: route_task is service-only SECURITY DEFINER with an in-function caller_jwt_role gate; routing history is append-only at the database boundary; a proposed assignee is revalidated at commit time by task_assignee_ineligible_reason
    audit_health_evidence: every transition writes a task_routing_events row carrying the reason code and the actor
    last_verified_sha: pending
    last_verified_at: 2026-08-18
    owner_gate: hosted migration application
    blocker: none
    residual_risks: No task is ever ASSIGNED, because no availability, workload or capability recommender exists yet (WRK-002/WRK-005 are unbuilt). Captured work therefore terminates in needs_routing or manual_review, which is truthful but not yet useful: there is no queue UI a person opens to work that list, and no approver is notified. Inventing an eligible assignee was rejected as the failure this program exists to stop.

