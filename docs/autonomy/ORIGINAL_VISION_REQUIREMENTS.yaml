    title: Durable inbound processing with leases, bounded retry and dead-letter
    description: source_events carries processing state, attempts, next-attempt time, lease owner and expiry, error category and dead-letter reason, with atomic claim/complete/fail RPCs.
    business_outcome: An inbound customer or staff message can never be silently lost, and a poison message cannot stall the queue.
    phase: stage1
    priority: P0
    dependencies: []
    status: locally_verified
    feature_flag: none
    runtime_entrypoint: src/app/api/cron/inbound-sweeper/route.ts
    database_evidence: src/db/migrations/0069_durable_inbound_processing.sql
    service_evidence: src/events/inbound-sweeper.ts
    ui_evidence: none
    test_evidence: tests/integration/durable-inbound-processing.test.ts; tests/campaign/inbound-sweeper.test.ts
    security_evidence: service_role-only SECDEF + caller_jwt_role gate + fail-closed privilege assertion in 0069; allowlisted in tests/integration/secure-definer-grants.test.ts
    audit_health_evidence: source_event_backlog(company) company-scoped counts
    last_verified_sha: 1ebaa80
    last_verified_at: 2026-08-17
    owner_gate: hosted migration application
    blocker: none
    residual_risks: The sweeper has no processor wired yet (FOUND-003), so events dead-letter as no_processor by design.

