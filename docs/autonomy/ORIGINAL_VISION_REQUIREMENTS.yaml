  - id: AIM-002
    title: Task-level deduplication
    description: A stable company-scoped task identity prevents the same follow-up being recreated on every re-analysis, while genuinely distinct recurring work is preserved.
    business_outcome: Staff do not receive the same task repeatedly.
    phase: stage1
    priority: P0
    dependencies: [AIM-001]
    status: locally_verified
    feature_flag: none
    runtime_entrypoint: src/management/ai-manager/analyze-conversation.ts and src/app/app/command/analyze/actions.ts — both production analysis paths now create tasks through create_task_deduplicated (migration 0073); tasks_set_identity_hash trigger fires on every task write
    database_evidence: src/db/migrations/0071_task_identity_dedup.sql (identity columns, task_identity_hash, partial unique index, task_duplicate_suggestions); src/db/migrations/0073_case_tasks_through_dedup.sql (create_management_case_atomic creates every task through the dedup boundary and records deduplicated_tasks)
    service_evidence: create_task_deduplicated create-or-return; src/management/ai-manager/task-identity.ts decides which business facts are offered; similarity suggestions are advisory only and never merge
    ui_evidence: src/app/app/command/analyze/AnalyzeForm.tsx reports deduplicated work rather than showing an unexplained zero
    test_evidence: tests/integration/task-dedup.test.ts (18 deterministic integration scenarios on a disposable local PostgreSQL); tests/integration/case-task-dedup-wiring.test.ts (13 scenarios covering the production wiring, non-merging of distinct work, and unchanged atomicity); tests/campaign/task-identity.test.ts (9 unit scenarios)
    security_evidence: identity is SERVER-computed by a SECURITY DEFINER trigger and recomputed on insert AND update so a caller or model cannot forge it; RPC is service-only with an in-function role gate; identity components are length-bounded; company_id is inside both the hash and the unique index; the suggestions table is service-write-only under RLS
    audit_health_evidence: the RPC returns a created flag distinguishing a new task from a replay
    last_verified_sha: 707761c
    last_verified_at: 2026-08-18
    owner_gate: hosted migration application
    blocker: none
    residual_risks: Exact identity only matches an identical normalised purpose, so a model that paraphrases its own title still produces a second task — that is concern (2) of migration 0071 (semantic similarity), which is advisory by design and has no producer yet, so task_duplicate_suggestions is never populated. THE OCCURRENCE WINDOW IS A UTC DATE, and an independent review was right that describing this as a midnight-boundary artefact understated it - the ai-monitor cron re-analyses a conversation on every new inbound message, so an unresolved follow-up on a thread that stays active is recreated ONCE PER UTC DAY. That is deliberate (recurring work is legitimately repeated) but it is a real cost against the stated outcome "staff do not receive the same task repeatedly", and a shorter or purpose-specific window is unbuilt. Within ONE analysis, repeats of the same title are given distinct identities on purpose: a model that lists two tasks has proposed two, and merging them discarded the second note. The manual command-centre path scopes identity to the submitted content: a free-text update names no stable entity, and merging on title alone would fuse distinct work.

  - id: AIM-003
    title: Truthful task routing
    description: Every AI-created task terminates in a truthful routing state (assigned, queued, needs routing, awaiting approval, rejected) with persisted routing reason and audit history.
    business_outcome: Work that the system captured actually reaches a person.
    phase: stage1
    priority: P0
    dependencies: [AIM-002]
    status: implementation_in_progress
    feature_flag: none
    runtime_entrypoint: src/management/routing/route-captured-tasks.ts with makeSupabaseRoutingDeps, called by BOTH production analysis paths — src/app/app/command/analyze/actions.ts and src/management/ai-manager/analyze-conversation.ts
    database_evidence: src/db/migrations/0072_task_routing_state.sql (task_routing with seven states, reason_code, one-active-row partial unique index; append-only task_routing_events; task_assignee_ineligible_reason — note its route_task RPC is DROPPED by 0078 and is no longer part of this requirement's evidence); src/db/migrations/0076_inbound_boundary_correction.sql (the capability re-check corrected to actor_has_capability, an approval FK, TRUNCATE closed, and a human decision protected from automated supersession); src/db/migrations/0077_inbound_boundary_correction_2.sql (a human decision must name an active member); src/db/migrations/0078_routing_provenance_split.sql (route_task_as_human / _as_ai / _as_system, the shared internal reachable by no role, and the provenance trigger — provenance is derived from WHICH function is called, never asserted by a caller); src/db/migrations/0082_review_loop_corrections.sql (only the routing boundary may supersede or delete a decision, and task_routing cannot be truncated)
    service_evidence: captureRoutingState maps the deterministic authority outcome to needs_routing or manual_review; ONE shared ports implementation so the two analysis paths cannot diverge; a routing failure is counted and reported, never silently dropped; an idempotent case replay routes nothing
    ui_evidence: src/app/app/command/analyze/AnalyzeForm.tsx renders the durable per-state counts and says plainly that nothing was executed and no one was notified
    test_evidence: tests/integration/task-routing.test.ts; tests/integration/routing-and-mapping-corrections.test.ts (12 scenarios pinning the confirmed defects, proven to FAIL against the pre-correction schema); tests/campaign/capture-routing.test.ts; tests/campaign/analyze-ui-truthfulness.test.ts; tests/campaign/ui-rendered-truthfulness.test.ts (rendered output, not source text)
    security_evidence: route_task is service-only SECURITY DEFINER with an in-function caller_jwt_role gate; routing history is append-only against UPDATE, DELETE and TRUNCATE (the last was a real gap, closed by privilege AND by a statement trigger); a proposed assignee is revalidated at commit time by task_assignee_ineligible_reason using the ACTOR-scoped capability check (the previous call passed a user id where a company id was expected and was therefore a constant false); an automated actor cannot supersede a human assignment, and the refusal is recorded as history
    audit_health_evidence: every transition writes a task_routing_events row carrying the reason code and the actor
    last_verified_sha: 1fd50b2
    last_verified_at: 2026-08-18
    owner_gate: hosted migration application
    blocker: none
    residual_risks: UNACCEPTED, pending the owner's acceptance of R1. OF-007 — a service-role caller asserting actor_source='human' by naming a real member — is FIXED: migration 0078 removed the spoofable route_task entirely, split the human path (authenticated only, actor derived from auth.uid()) from the AI and system paths (service-only, source fixed by the function), and enforces the split with a fail-closed trigger; migration 0082 additionally stops an automated caller from deactivating or deleting a standing human decision to get past it, which an independent review demonstrated was the same outcome by a different door. The requirement nonetheless stays implementation_in_progress rather than being restored to verified on this package's own say-so — it was taken off verified before any R1 code, and only the owner's acceptance of R1 puts it back. No task is ever ASSIGNED BY THE SYSTEM, because no availability, workload or capability recommender exists yet (WRK-002/WRK-005 are unbuilt) — the assigned state itself now works and is tested, but nothing proposes an assignee. Captured work therefore terminates in needs_routing or manual_review, which is truthful but not yet useful: there is no queue UI a person opens to work that list, and no approver is notified. Inventing an eligible assignee was rejected as the failure this program exists to stop. An independent review found the earlier claim "every AI-created task terminates in a truthful routing state" was false because the WhatsApp thread-analysis path routed nothing at all; both production paths now route, through one shared implementation.

