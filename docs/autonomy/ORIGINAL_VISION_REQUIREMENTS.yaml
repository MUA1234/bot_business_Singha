  - id: FOUND-003
    title: Production-reachable staff and finance intake
    description: A real production path classifies sender identity from trusted records and routes a staff finance message into ingestSourceEvent, policy, authority and approval — never into customer order intake.
    business_outcome: An employee reporting a payment is handled as finance, not asked for a delivery address.
    phase: stage1
    priority: P0
    dependencies: [FOUND-001]
    status: blocked_owner
    feature_flag: none
    runtime_entrypoint: src/app/api/webhooks/whatsapp/route.ts and src/inngest/functions.ts (both dispatch through src/lib/inbound/dispatch.ts via the shared src/lib/inbound/production-deps.ts)
    database_evidence: src/db/migrations/0070_channel_identity_resolution.sql (channel_identities + resolve_channel_identity); 0074_channel_account_company_resolution.sql (channel_accounts + resolve_channel_company); 0075_inbound_review_queue.sql (inbound_reviews, record/resolve RPCs, actor_has_capability); 0076_inbound_boundary_correction.sql (canonical event identity, the explicit dispatch lifecycle with leases, reconciliation of duplicate receipts, and the confirmed 0074/0075 defects); 0077_inbound_boundary_correction_2.sql (a capture can never be company-less, a decided non-capture settles, and work no processor can handle is released rather than dead-lettered); 0079_dispatch_release.sql (a receipt claimed at a deadline is handed back uncharged); 0080_owner_configuration_surface.sql (audited channel-account mapping, capability assignment and a setup-status read); 0081_approval_submitter_provenance.sql (OF-013 — a system-submitted approval request is possible at all, with explicit and immutable submitter provenance)
    service_evidence: src/lib/inbound/dispatch-receipt.ts — ONE orchestration used by both the synchronous route and the durable worker (claim the lease, resolve the company, dispatch, record); src/lib/inbound/receipt.ts; src/lib/inbound/dispatch.ts (the only production caller of ingestSourceEvent); src/lib/inbound/company-resolution.ts; src/lib/identity/inbound-routing.ts; src/lib/finance/intent-gate.ts with per-company currencies; src/lib/provider/failure.ts (transient vs permanent vs credential-not-configured)
    ui_evidence: src/app/app/admin/inbound-review/page.tsx — a capability-gated queue in the navigation; /api/health reports openInboundReviews and unattributedInbound
    test_evidence: tests/integration/extreme-end-to-end.test.ts (R1 §7 — the NINE required end-to-end paths, each driving the real adapter, receipt, dispatch orchestration, cron route handlers, finance capture processor, processSourceEvent, consumer store, policy, approval, audit, review queue and health over a pg-backed Supabase client; discrimination measured — 9 of 9 fail at 0001–0075, 4 of 9 at 0001–0077, 3 of 9 at 0001–0080); tests/integration/rendered-matches-persisted.test.tsx (3 — the review row and the analyze routing counts rendered from rows the pipeline actually wrote); tests/integration/system-submitted-approval.test.ts (5 — OF-013, 4 of 5 fail at 0080); tests/integration/inbound-event-identity.test.ts (17 scenarios across two connections — first delivery, replay before/during/after processing, concurrent deliveries, webhook-vs-worker race, both crash windows, sweeper exclusion, health); tests/integration/inbound-upgrade-reconciliation.test.ts (9 scenarios on a purpose-built database at 0075 upgraded to 0076); tests/integration/inbound-end-to-end.test.ts (8); tests/integration/dispatch-drain.test.ts; tests/integration/owner-configuration.test.ts; tests/integration/channel-account-company.test.ts (10); tests/integration/inbound-review-queue.test.ts (14); tests/integration/routing-and-mapping-corrections.test.ts (12); tests/integration/channel-identity.test.ts (10); tests/campaign/dispatch-receipt.test.ts (8 order-of-operations scenarios); tests/campaign/webhook-callgraph.test.ts; tests/campaign/inbound-adapter.test.ts (9); tests/campaign/finance-capture-processor.test.ts; tests/campaign/dispatch-drain.test.ts; tests/campaign/finance-intake.test.ts (18); tests/campaign/inbound-routing.test.ts (9); tests/campaign/company-resolution.test.ts (9); tests/campaign/provider-failure.test.ts (13); tests/campaign/inbound-review-surface.test.ts (10); tests/campaign/ui-rendered-truthfulness.test.ts (10); scripts/verify/browser-check.mjs. The boundary-correction scenarios were run against the PRE-correction schema and fail there — 25 of 29 — so they discriminate rather than decorate.
    security_evidence: identity from trusted records evaluated BEFORE intent; unknown/ambiguous never staff; a customer asserting a financial event is never classified, let alone captured; the receiving account decides the company and an unattributable message is not processed at all; exact decimal amount parsing; currency never inferred or converted; material amounts require a referenced document; capture yields a source event for policy/authority only — no posting, payment or approval affordance exists on the result; the review queue is capability-gated for read AND for resolution, re-checked at the database against the named actor
    audit_health_evidence: inbound.finance_captured structured log with source event id and ingest status; inbound.review_resolved audit event written in the same transaction as the decision; unattributedInbound and openInboundReviews in /api/health; inbound_dispatch_health() and the company-scoped source_event_backlog(), both blind to reconciled duplicates
    last_verified_sha: 1fd50b2
    last_verified_at: 2026-08-18
    owner_gate: a model provider credential for finance classification; mapping each receiving WhatsApp number to its company in channel_accounts; granting operations.inbound.review to the people who should work the queue; hosted migration application
    blocker: no model provider is configured for finance classification
    residual_risks: BLOCKED by OF-016 as well as by the classifier. A finance message scored as a possible duplicate now pauses REVERSIBLY (0083) instead of being terminally discarded, but there is no resolution RPC, no review screen and no write grant — so a real payment can pause in awaiting_information with nothing in the product able to move it again, and the only page rendering financial events reads exclusively from approval_requests. That is a material blocker recorded rather than repaired, because this package's two correction loops are spent. R1 §7's extreme end-to-end run proved the rest of the chain end to end with a classification FIXTURE, and in doing so found OF-013 — a system-submitted approval request could not be created at all, so every captured finance message that reached the approval branch dead-lettered without reaching an approver. That is fixed (migration 0081). Everything repository-controlled is implemented and verified locally. Marked blocked_owner rather than verified because the classifier that decides whether a staff message describes a financial event has no provider, so TODAY a staff message reaches the review queue rather than finance capture. That is the correct fail-closed behaviour and it is a real improvement on being asked for a delivery address, but it is not the requirement's full outcome, and the remaining step is an owner action rather than code. Two further owner actions matter: until a receiving number is mapped in channel_accounts the documented single-tenant bridge is what attributes messages (safe while exactly one company exists, and it stops applying the moment a second one does), and nobody can work the queue until someone is granted operations.inbound.review. A message that cannot be attributed to any company has no company-scoped queue to land in by construction; it is persisted and counted in health only.

