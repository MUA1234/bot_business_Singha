# Singha Central — Original Vision requirement register
#
# The machine-readable source of truth for what the approved program requires and what actually
# exists. `npm run autonomy:audit` parses this file, REFUSES a completion status that lacks its
# evidence, and regenerates ORIGINAL_VISION_COVERAGE_MATRIX.md from it.
#
# Statuses: absent | specified | foundation_only | implementation_in_progress |
#           implemented_unverified | locally_verified | preview_verified | staging_verified |
#           production_verified | blocked_owner | blocked_external | deliberately_deferred
#
# Evidence rules (enforced by the audit, not by good intentions):
#   * locally_verified REQUIRES runtime_entrypoint + test_evidence + last_verified_sha.
#   * A schema contract, a feature flag, a type, a doc, a prompt or a fixture is NOT implementation.
#   * Percentages are never evidence.
#
# POPULATION STATE: all owner-approved groups are expanded into individual records. `_pending_population`
# is a HARD AUDIT FAILURE — see scripts/autonomy/audit-requirements.mjs. Statuses are set by
# INSPECTING RUNTIME CODE, never from a document, a feature flag or a schema contract.

requirements:

  # ── FOUND — runtime integrity and security ──────────────────────────────────────────────────
  - id: FOUND-001
    title: Durable inbound processing with leases, bounded retry and dead-letter
    description: source_events carries processing state, attempts, next-attempt time, lease owner and expiry, error category and dead-letter reason, with atomic claim/complete/fail RPCs.
    business_outcome: An inbound customer or staff message can never be silently lost, and a poison message cannot stall the queue.
    phase: stage1
    priority: P0
    dependencies: []
    status: locally_verified
    feature_flag: none
    runtime_entrypoint: src/app/api/cron/inbound-sweeper/route.ts
    database_evidence: src/db/migrations/0069_durable_inbound_processing.sql
    service_evidence: src/events/inbound-sweeper.ts
    ui_evidence: none
    test_evidence: tests/integration/durable-inbound-processing.test.ts; tests/campaign/inbound-sweeper.test.ts
    security_evidence: service_role-only SECDEF + caller_jwt_role gate + fail-closed privilege assertion in 0069; allowlisted in tests/integration/secure-definer-grants.test.ts
    audit_health_evidence: source_event_backlog(company) company-scoped counts
    last_verified_sha: 1ebaa80
    last_verified_at: 2026-08-17
    owner_gate: hosted migration application
    blocker: none
    residual_risks: The sweeper has no processor wired yet (FOUND-003), so events dead-letter as no_processor by design.

  - id: FOUND-002
    title: Worker fairness by eligibility rather than ordering
    description: A repeatedly failing row backs off and stops competing for batch slots; later eligible work continues; expired leases return to eligibility.
    business_outcome: One bad message cannot starve every other customer.
    phase: stage1
    priority: P0
    dependencies: [FOUND-001]
    status: locally_verified
    feature_flag: none
    runtime_entrypoint: src/app/api/cron/inbound-sweeper/route.ts
    database_evidence: claim_source_events eligibility predicate in 0069
    service_evidence: src/events/inbound-sweeper.ts
    ui_evidence: none
    test_evidence: tests/integration/durable-inbound-processing.test.ts (fairness beyond 200 rows; multi-company opportunity; lease expiry after restart)
    security_evidence: claim is service-only
    audit_health_evidence: sweeper reports partialFailure and counts
    last_verified_sha: 1ebaa80
    last_verified_at: 2026-08-17
    owner_gate: none
    blocker: none
    residual_risks: none known

  - id: FOUND-003
    title: Production-reachable staff and finance intake
    description: A real production path classifies sender identity from trusted records and routes a staff finance message into ingestSourceEvent, policy, authority and approval — never into customer order intake.
    business_outcome: An employee reporting a payment is handled as finance, not asked for a delivery address.
    phase: stage1
    priority: P0
    dependencies: [FOUND-001]
    status: implementation_in_progress
    feature_flag: none
    runtime_entrypoint: src/app/api/webhooks/whatsapp/route.ts (dispatchInbound)
    database_evidence: src/db/migrations/0070_channel_identity_resolution.sql (channel_identities + resolve_channel_identity)
    service_evidence: src/lib/inbound/dispatch.ts (calls ingestSourceEvent); src/lib/identity/inbound-routing.ts; src/lib/finance/intent-gate.ts; src/schemas/finance-intent.ts
    ui_evidence: none
    test_evidence: tests/campaign/webhook-callgraph.test.ts (5, route-level proof); tests/campaign/finance-intake.test.ts (18); tests/campaign/inbound-routing.test.ts (9); tests/integration/channel-identity.test.ts (10)
    security_evidence: identity from trusted records evaluated BEFORE intent; unknown/ambiguous never staff; a customer asserting a financial event is never classified, let alone captured; exact decimal amount parsing; currency never inferred or converted; material amounts require a referenced document; capture yields a source event for policy/authority only — no posting, payment or approval affordance exists on the result
    audit_health_evidence: inbound.finance_captured structured log with source event id and ingest status
    last_verified_sha: none
    last_verified_at: none
    owner_gate: none
    blocker: none
    residual_risks: Wired end to end and proven at the route level. NOT complete because (a) classifyFinanceIntent returns null until a model provider is configured, so a staff message today fails closed to manual review rather than being captured — the capture path is exercised only by tests; (b) there is no review QUEUE UI, so recordForReview writes a structured log against an already-durable event rather than a surface a person opens (AIM-003); (c) the company is still the hardcoded pilot constant rather than resolved from the receiving WhatsApp number.

