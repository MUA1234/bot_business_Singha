    ui_evidence: none
    test_evidence: tests/integration/durable-inbound-processing.test.ts; tests/campaign/inbound-sweeper.test.ts
    security_evidence: service_role-only SECDEF + caller_jwt_role gate + fail-closed privilege assertion in 0069; allowlisted in tests/integration/secure-definer-grants.test.ts
    audit_health_evidence: source_event_backlog(company) company-scoped counts
    last_verified_sha: 707761c
    last_verified_at: 2026-08-17
    owner_gate: hosted migration application
    blocker: none
