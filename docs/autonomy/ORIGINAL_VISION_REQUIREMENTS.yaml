# Singha Central — Original Vision requirement register
#
# The machine-readable source of truth for what the approved program requires and what actually
# exists. `npm run autonomy:audit` parses this file, REFUSES a completion status that lacks its
# evidence, and regenerates ORIGINAL_VISION_COVERAGE_MATRIX.md from it.
#
# Statuses: absent | specified | foundation_only | implementation_in_progress |
#           implemented_unverified | locally_verified | preview_verified | staging_verified |
#           production_verified | blocked_owner | blocked_external | deliberately_deferred
#
# Evidence rules (enforced by the audit, not by good intentions):
#   * locally_verified REQUIRES runtime_entrypoint + test_evidence + last_verified_sha.
#   * A schema contract, a feature flag, a type, a doc, a prompt or a fixture is NOT implementation.
#   * Percentages are never evidence.
#
# POPULATION STATE: all owner-approved groups are expanded into individual records. `_pending_population`
# is a HARD AUDIT FAILURE — see scripts/autonomy/audit-requirements.mjs. Statuses are set by
# INSPECTING RUNTIME CODE, never from a document, a feature flag or a schema contract.

requirements:

