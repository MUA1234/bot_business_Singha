    business_outcome: An inbound customer or staff message can never be silently lost, and a poison message cannot stall the queue.
    phase: stage1
    priority: P0
    dependencies: []
    status: locally_verified
    feature_flag: none
    runtime_entrypoint: src/app/api/cron/inbound-sweeper/route.ts
    database_evidence: src/db/migrations/0069_durable_inbound_processing.sql
