# CI — Production Security & Reliability Gate (WP F).
# Two required jobs:
#   verify   — static + unit + build + dependency-audit gate (no database).
#   db-tests — a DISPOSABLE Postgres per run (+ Supabase-compat shim) with migrations
#              applied and ALL integration/RLS/concurrency tests. It FAILS LOUD if the
#              test database is not configured — it never silently skips.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (from lockfile)
        run: npm ci

      - name: Secret scan
        run: npm run secret-scan
      - name: Migration lint (naming, ordering, gaps, duplicates)
        run: npm run migration-lint
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder-anon-key
      - name: Dependency audit gate (approved-exception validation)
        run: npm run audit-check

      # The kernel suites again, but with EVERY outbound network primitive replaced by one that
      # throws. Asserting "this code contacts nothing" about code you wrote is easy; asserting it
      # about everything it imports is not, and passing under this config is the proof. It also
      # runs the guard's own self-test, which is skipped under the ordinary config — a guard
      # nobody checks is a guard that silently stops working.
      - name: Outbound-network guard
        run: npm run test:no-network

  db-tests:
    runs-on: ubuntu-latest
    # A throwaway Postgres per CI run — never a shared/production database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: singha_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # The disposable service DB. SSL is off (local); the pg clients honour this.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/singha_test
      PGSSL: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (from lockfile)
        run: npm ci

      # Fail LOUD (never skip) if a required test DB is not configured.
      - name: Require a test database
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is not configured — the required database-test job cannot run."
            exit 1
          fi

      # ── CORE campaign ────────────────────────────────────────────────────────────────
      # Released migrations ONLY. No draft object exists on this database, which is what
      # production will look like and what the enumeration gates are written against: they
      # assert that every SECURITY DEFINER function in `public` is classified, so a
      # quarantined draft function they correctly refuse to classify would fail them.
      - name: Install Supabase-compatibility shim (roles + auth.uid + grants)
        run: node scripts/apply-sql.mjs tests/integration/helpers/supabase-shim.sql

      - name: Apply migrations to the disposable database
        run: npm run migrate

      - name: Core integration / RLS / capability / concurrency tests
        run: npm run test:integration

      # ── KERNEL campaign ──────────────────────────────────────────────────────────────
      # A SEPARATE database, because the kernel suites need the quarantined R1 draft chain
      # and the core campaign must never see it. Creating a second database rather than
      # adding drafts to the first is the whole point of the split: until it existed, the
      # kernel suites ran against a database that could not satisfy them, and CI's
      # integration job could not be green.
      - name: Create a separate database for the kernel campaign
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'create database singha_kernel'

      - name: Prepare the kernel database (shim + migrations + draft chain)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/singha_kernel
          R1_DRAFT_CONFIRM: disposable-local-only
        run: |
          node scripts/apply-sql.mjs tests/integration/helpers/supabase-shim.sql
          npm run migrate
          node scripts/r1/draft-migrate.mjs --up

      - name: R1/R2 management-kernel tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/singha_kernel
          R1_DRAFT_CONFIRM: disposable-local-only
        run: npm run test:kernel

      # ── DRAFT-SCHEMA campaign ────────────────────────────────────────────────────────
      # The third campaign. It applies the whole draft chain and then ROLLS IT BACK, which is
      # incompatible with any shared database — on the core one it would introduce draft
      # objects the enumeration gates refuse to classify, and on the kernel one its teardown
      # would remove the schema its neighbours depend on. It builds and drops its OWN database
      # inside this server, so it needs only a connection to it.
      - name: R1 draft-schema and rollback tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          R1_DRAFT_CONFIRM: disposable-local-only
        run: npm run test:draft-schema
