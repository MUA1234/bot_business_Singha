# Non-interactive CI (Architecture V2 change plan §13.1; Constitution §13).
# Runs on every push and PR. No secrets required for these steps.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (from lockfile)
        run: npm ci

      - name: Secret scan
        run: npm run secret-scan

      - name: Type check
        run: npm run typecheck

      - name: Lint
        # ESLint is declared in package.json + lockfile; runs from `npm ci`.
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          # Build must not require real secrets. Placeholder public values keep
          # Next/Supabase client construction happy; nothing connects at build time.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder-anon-key

      - name: Migration lint (naming, ordering, gaps, duplicates)
        run: npm run migration-lint

      - name: Migrate the test database (apply pending migrations)
        # Runs only when a non-prod test database is configured (repo secret).
        if: ${{ secrets.TEST_DATABASE_URL != '' }}
        run: npm run migrate
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

      - name: Company-isolation / RLS integration tests
        if: ${{ secrets.TEST_DATABASE_URL != '' }}
        run: npm run test:integration
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
